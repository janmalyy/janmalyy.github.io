<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
  <script>
    (function() {
      var preferredLang = localStorage.getItem('language');
      var currentPath = window.location.pathname;
      var baseurl = "{{ site.baseurl }}";
      
      var relativePath = currentPath;
      if (baseurl && currentPath.indexOf(baseurl) === 0) {
          relativePath = currentPath.substring(baseurl.length);
      }
      
      if (preferredLang === 'cs' && (relativePath === '/' || relativePath === '/index.html')) {
        window.location.href = "{{ '/cs/' | relative_url }}";
      } else if (preferredLang === 'en' && (relativePath === '/cs/' || relativePath === '/cs/index.html')) {
        window.location.href = "{{ '/' | relative_url }}";
      }
    })();
  </script>
</head>
